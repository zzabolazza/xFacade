<h2>群控首版架构</h2>
<p class="subtitle">主进程负责会话和浏览器连接，悬浮条只负责展示与发命令，避免两个进程同时管理浏览器状态。</p>

  <div class="mockup-body" style="padding:24px">
    <div style="display:grid;grid-template-columns:1fr auto 1.4fr auto 1fr;gap:14px;align-items:center">
      <div style="border:2px solid var(--border);padding:16px;text-align:center">
        <div class="label">辅助进程</div>
        <h3 style="margin:8px 0">桌面悬浮控制条</h3>

      </div>
      <div style="font-size:24px">⇄</div>
      <div style="border:2px solid var(--border);padding:16px;text-align:center">

        <h3 style="margin:8px 0">群控会话服务</h3>
        <p style="margin:0">唯一状态源 · 操作队列<br>自动暂停 · 标签映射<br>窗口布局计算</p>

      <div style="font-size:24px">⇄</div>
