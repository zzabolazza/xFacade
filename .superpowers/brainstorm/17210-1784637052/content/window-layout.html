<h2>群控窗口如何铺排？</h2>
<p class="subtitle">请选择第一版最符合你使用习惯的默认布局；后续仍可保留其他布局作为快捷操作。</p>

<div class="cards">
  <div class="card" data-choice="balanced-grid" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:18px">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;height:150px">
        <div class="placeholder">1</div><div class="placeholder">2</div><div class="placeholder">3</div>
        <div class="placeholder">4</div><div class="placeholder">5</div><div class="placeholder">6</div>
      </div>
    </div>
    <div class="card-body">
      <h3>A · 自动均匀平铺</h3>
      <p>按选中实例数量自动计算行列，平均填满当前显示器；适合作为默认快捷操作。</p>
    </div>
  </div>

  <div class="card" data-choice="per-monitor-groups" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:18px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;height:150px">
        <div style="border:2px solid var(--border);padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div class="placeholder">A1</div><div class="placeholder">A2</div>
          <div class="placeholder">A3</div><div class="placeholder">A4</div>
        </div>
        <div style="border:2px solid var(--border);padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <div class="placeholder">B1</div><div class="placeholder">B2</div>
          <div class="placeholder">B3</div><div class="placeholder">B4</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>B · 按显示器分组</h3>
      <p>把实例组分配到指定显示器，每块屏幕独立均匀平铺；适合多显示器固定工位。</p>
    </div>
  </div>

  <div class="card" data-choice="master-focus" onclick="toggleSelect(this)">
    <div class="card-image" style="padding:18px">
      <div style="display:grid;grid-template-columns:1.5fr 1fr;gap:8px;height:150px">
        <div class="placeholder" style="font-size:18px">主控</div>
        <div style="display:grid;grid-template-rows:repeat(3,1fr);gap:6px">
          <div class="placeholder">从 1</div><div class="placeholder">从 2</div><div class="placeholder">从 3</div>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>C · 主控突出显示</h3>
      <p>主浏览器占更大区域，从浏览器在侧边整齐排列；便于观察和操作主控窗口。</p>
    </div>
  </div>
</div>
